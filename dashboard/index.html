<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>NBProf Dashboard SaaS</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { font-family: Arial; background:#EEF2F7; margin:0; }
.container { padding:20px; }

.card {
  background:white;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
}

.kpi-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

.kpi-card {
  padding:15px;
  border-radius:10px;
  background:white;
  box-shadow:0 2px 8px rgba(0,0,0,0.05);
}

.bar { height:6px; background:#ddd; border-radius:5px; }
.fill { height:100%; border-radius:5px; }

.diag { padding:12px; border-radius:8px; margin:8px 0; }
.good { background:#DCFCE7; }
.warn { background:#FEF3C7; }
.bad  { background:#FEE2E2; }

.swot { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.swot div { padding:10px; border-radius:8px; }
.f { background:#EFF6FF; }
.w { background:#FEF3C7; }
.o { background:#DCFCE7; }
.t { background:#FEE2E2; }

table { width:100%; border-collapse:collapse; }
td, th { border:1px solid #ddd; padding:6px; text-align:center; }
</style>
</head>

<body>

<div class="container">

<!-- ✅ SAISIE -->
<div class="card">
<h3>Saisie des données</h3>
<input id="nom" placeholder="Indicateur">
<input id="obj" type="number" placeholder="Objectif">
<input id="real" type="number" placeholder="Réalisé">
<button onclick="add()">Ajouter</button>
<button onclick="compute()">⚡ Générer le tableau de bord</button>
</div>

<!-- ✅ DONNÉES -->
<div class="card">
<h3>Données modifiables</h3>
<div id="data-list"></div>
</div>

<!-- ✅ KPI -->
<div class="kpi-grid" id="kpi"></div>

<!-- ✅ SCORE -->
<div class="card">
<h3>Score global</h3>
<h1 id="score"></h1>
<canvas id="gauge"></canvas>
</div>

<!-- ✅ ANALYSE TABLE -->
<div class="card">
<h3>Analyse des écarts</h3>
<table>
<thead>
<tr><th>Indicateur</th><th>Objectif</th><th>Réalisé</th><th>Taux</th></tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>

<!-- ✅ GRAPH -->
<div class="card">
<canvas id="chart"></canvas>
</div>

<!-- ✅ RADAR -->
<div class="card">
<canvas id="radar"></canvas>
</div>

<!-- ✅ RISK -->
<div class="card">
<h3>Matrice des risques</h3>
<div id="risk"></div>
</div>

<!-- ✅ SWOT -->
<div class="card">
<h3>Analyse SWOT</h3>
<div id="swot"></div>
</div>

<!-- ✅ IA DIAGNOSTIC -->
<div class="card">
<h3>Recommandations automatiques</h3>
<div id="diag"></div>
</div>

</div>

<script>

// ✅ DONNÉES INITIALES (comme ton modèle [1])
let data = [
 {n:"CA (MDH)",o:320,r:308},
 {n:"Satisfaction",o:80,r:78},
 {n:"Productivité",o:100,r:84},
 {n:"Clients",o:4500,r:4820}
];

function add(){
 let n=nom.value;
 let o=parseFloat(obj.value);
 let r=parseFloat(real.value);
 if(!n||isNaN(o)||isNaN(r)) return alert("Erreur");
 data.push({n,o,r});
 compute();
}

// ✅ DONNÉES MODIFIABLES
function renderDataInputs(){
 let html="";
 data.forEach((d,i)=>{
  html+=`
  <div>
  <b>${d.n}</b>
  Obj <input value="${d.o}" onchange="data[${i}].o=this.value;compute()">
  Réel <input value="${d.r}" onchange="data[${i}].r=this.value;compute()">
  </div>`;
 });
 document.getElementById("data-list").innerHTML=html;
}

// ✅ CALCUL GLOBAL
function compute(){

 renderDataInputs();

 let kpi="", table="", diag="", total=0;

 data.forEach(d=>{
  let p=(d.r/d.o)*100;
  total+=p;

  let color=p>=100?"green":p>=80?"orange":"red";

  // KPI
  kpi+=`
  <div class="kpi-card">
    ${d.n}
    <h2>${d.r}</h2>
    ${p.toFixed(1)}%
    <div class="bar">
      <div class="fill" style="width:${p}%;background:${color}"></div>
    </div>
  </div>`;

  // TABLE
  table+=`<tr>
    <td>${d.n}</td>
    <td>${d.o}</td>
    <td>${d.r}</td>
    <td>${p.toFixed(1)}%</td>
  </tr>`;

  // IA INDIVIDUELLE
  if(p>=100)
    diag+=`<div class="diag good">✅ ${d.n} excellent (${p.toFixed(0)}%)</div>`;
  else if(p>=90)
    diag+=`<div class="diag warn">⚠ ${d.n} à améliorer (${p.toFixed(0)}%)</div>`;
  else
    diag+=`<div class="diag bad">❌ ${d.n} critique (${p.toFixed(0)}%)</div>`;

  // ALERTES
  if(p<70)
    diag+=`<div class="diag bad">🚨 ALERTE ${d.n}</div>`;
 });

 let score=total/data.length;

 document.getElementById("score").innerText=score.toFixed(1)+"%";
 document.getElementById("kpi").innerHTML=kpi;
 document.getElementById("table").innerHTML=table;

 // ✅ IA GLOBALE
 if(score>=100)
  diag+=`<div class="diag good">🏆 Performance excellente</div>`;
 else if(score>=90)
  diag+=`<div class="diag warn">📊 Performance satisfaisante</div>`;
 else
  diag+=`<div class="diag bad">🚨 Plan d’action urgent</div>`;

 document.getElementById("diag").innerHTML=diag;

 // ✅ JAUGE
 new Chart(document.getElementById("gauge"), {
  type:"doughnut",
  data:{datasets:[{data:[score,100-score],backgroundColor:["orange","#ddd"]}]}
 });

 // ✅ GRAPH + FORECAST
 new Chart(document.getElementById("chart"), {
  type:"line",
  data:{
   labels:data.map(d=>d.n),
   datasets:[
    {label:"Réel",data:data.map(d=>d.r)},
    {label:"Prévision",data:data.map(d=>d.r*1.1),borderDash:[5,5]}
   ]
  }
 });

 // ✅ RADAR
 new Chart(document.getElementById("radar"), {
  type:"radar",
  data:{
   labels:data.map(d=>d.n),
   datasets:[{data:data.map(d=>(d.r/d.o)*100)}]
  }
 });

 // ✅ RISK
 let riskHTML="<table>";
 for(let i=5;i>=1;i--){
  riskHTML+="<tr>";
  for(let j=1;j<=5;j++){
   let val=i*j;
   let color=val<6?"#DCFCE7":val<12?"#FEF3C7":"#FEE2E2";
   riskHTML+=`<td style="background:${color}">${val}</td>`;
  }
  riskHTML+="</tr>";
 }
 riskHTML+="</table>";
 document.getElementById("risk").innerHTML=riskHTML;

 // ✅ SWOT
 document.getElementById("swot").innerHTML=`
 <div class="swot">
 <div class="f">Forces ✔ performance globale correcte</div>
 <div class="w">Faiblesses ⚠ productivité</div>
 <div class="o">Opportunités 📈 croissance marché</div>
 <div class="t">Menaces ⚡ concurrence</div>
 </div>`;
}

window.onload=compute;

</script>

</body>
</html>
