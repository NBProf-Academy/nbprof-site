<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NBProf Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: 'Segoe UI';
  background: #F1F5F9;
  margin: 0;
}

header {
  background: #1B2A4A;
  color: #C8922A;
  padding: 15px 30px;
  font-weight: bold;
}

.container {
  padding: 30px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 20px;
}

input, select {
  padding: 8px;
  margin: 5px;
  width: 160px;
}

button {
  padding: 10px;
  background: #1B2A4A;
  color: white;
  border: none;
  cursor: pointer;
}

.kpi {
  font-size: 28px;
  font-weight: bold;
  color: #1B2A4A;
}

.good { color: green; }
.mid { color: orange; }
.bad { color: red; }

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  border: 1px solid #ddd;
  padding: 8px;
  text-align: center;
}
</style>
</head>

<body>

<header>🎯 NBProf Performance Dashboard</header>

<div class="container">

<div class="card">
<h3>Saisie des données</h3>

<select id="secteur">
<option>Commerce / Ventes</option>
<option>Banque / Finance</option>
<option>Éducation</option>
<option>Santé</option>
<option>Industrie</option>
</select>

<input id="nom" placeholder="Indicateur">
<input id="obj" type="number" placeholder="Objectif">
<input id="real" type="number" placeholder="Réalisé">

<br><br>
<button onclick="ajouter()">Ajouter</button>
<button onclick="generer()">⚡ Générer</button>
</div>

<div class="card">
<h3>Score global</h3>
<div id="score" class="kpi">—</div>
</div>

<div class="card">
<h3>Analyse des écarts</h3>
<table>
<thead>
<tr>
<th>Indicateur</th>
<th>Objectif</th>
<th>Réalisé</th>
<th>Écart</th>
<th>Taux</th>
<th>Statut</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>

<div class="card">
<h3>Graphique</h3>
<canvas id="chart"></canvas>
</div>

<div class="card">
<h3>Recommandations automatiques</h3>
<p id="reco">—</p>
</div>

</div>

<script>
let data = [];
let chart;

function ajouter(){
  let nom = document.getElementById("nom").value;
  let obj = parseFloat(document.getElementById("obj").value);
  let real = parseFloat(document.getElementById("real").value);

  if(!nom || isNaN(obj) || isNaN(real)){
    alert("Veuillez remplir les champs");
    return;
  }

  data.push({nom, obj, real});

  document.getElementById("nom").value="";
  document.getElementById("obj").value="";
  document.getElementById("real").value="";
}

function generer(){
  let table = document.getElementById("table");
  table.innerHTML = "";

  let total = 0;

  data.forEach(d=>{
    let ecart = d.real - d.obj;
    let taux = (d.real / d.obj) * 100;
    total += taux;

    let statut, cls;

    if(taux >= 100){
      statut = "✅";
      cls = "good";
    } else if(taux >= 80){
      statut = "⚠️";
      cls = "mid";
    } else {
      statut = "❌";
      cls = "bad";
    }

    table.innerHTML += `
    <tr>
      <td>${d.nom}</td>
      <td>${d.obj}</td>
      <td>${d.real}</td>
      <td>${ecart}</td>
      <td class="${cls}">${taux.toFixed(1)}%</td>
      <td>${statut}</td>
    </tr>`;
  });

  let score = total / data.length;
  document.getElementById("score").innerText = score.toFixed(1) + "%";

  let reco = "";
  if(score >= 100) reco = "✅ Excellente performance";
  else if(score >= 80) reco = "⚠️ Performance acceptable";
  else reco = "❌ Performance faible";

  document.getElementById("reco").innerText = reco;

  let labels = data.map(d=>d.nom);
  let values = data.map(d=>d.real);

  if(chart) chart.destroy();

  chart = new Chart(document.getElementById("chart"), {
    type: "bar",
    data: {
      labels: labels,
      datasets: [{
        label: "Performance",
        data: values,
        backgroundColor: "#0D7377"
      }]
    }
  });
}
</script>

</body>
</html>
